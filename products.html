<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dharshini Mart | Products</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7faf7;
            color: #263326;
        }

        /* NAVBAR */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 7%;

            background: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
        }

        .logo span {
            font-size: 30px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
        }

        nav a:hover,
        nav a.active {
            color: #2f7d32;
        }


        /* PRODUCTS PAGE */

        .products-page {
            width: 86%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .section-label {
            color: #6b8e23;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .products-header h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .products-header p {
            color: #777;
            font-size: 17px;
        }


        /* PRODUCT GRID */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 40px;
        }


        /* PRODUCT CARD */

        .product-card {
            background: white;

            border: 1px solid #e5e5e5;
            border-radius: 15px;

            padding: 20px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.06);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.10);
        }


        .product-image {
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f8f1;

            border-radius: 12px;

            font-size: 75px;

            margin-bottom: 20px;
        }


        .product-card h2 {
            margin: 8px 0;
            font-size: 22px;
        }


        .product-card p {
            color: #777;
            min-height: 40px;
        }


        .product-card h3 {
            color: #2f7d32;

            font-size: 19px;

            margin: 15px 0;
        }


        /* STOCK */

        .stock-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .out-stock {
            color: #c62828;
            font-weight: bold;
        }


        /* BUTTON */

        .product-card button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #2f7d32;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .product-card button:hover {
            background: #246428;
        }


        .product-card button:disabled {
            background: #999;
            cursor: not-allowed;
        }


        /* EMPTY */

        .empty-products {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            background: white;

            border-radius: 15px;

            border: 1px solid #e5e5e5;

            color: #777;

            font-size: 18px;
        }


        /* FOOTER */

        footer {
            margin-top: 70px;

            padding: 25px;

            text-align: center;

            background: #263326;

            color: white;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .products-header h1 {
                font-size: 32px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <span>🥬</span>

            <strong>
                Dharshini Mart
            </strong>

        </div>


        <nav>

            <a href="home.html">
                Home
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="products.html"
               class="active">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="#">
                Account
            </a>

        </nav>

    </header>



    <!-- PRODUCTS -->

    <main class="products-page">


        <div class="products-header">

            <p class="section-label">
                FRESH FROM FARM
            </p>

            <h1>
                Our Products
            </h1>

            <p>
                Fresh vegetables and fruits delivered
                to your doorstep.
            </p>

        </div>



        <!-- PRODUCTS WILL LOAD HERE -->

        <section
            class="product-grid"
            id="productGrid"
        >

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Dharshini Mart.
            All rights reserved.
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script>


        /* =====================================
           LOAD PRODUCTS FROM ADMIN
        ====================================== */

        let products =
            JSON.parse(
                localStorage.getItem(
                    "adminProducts"
                )
            ) || [];



        /* =====================================
           DISPLAY PRODUCTS
        ====================================== */

        function displayProducts() {


            const productGrid =
                document.getElementById(
                    "productGrid"
                );


            productGrid.innerHTML = "";



            /* NO PRODUCTS */

            if (products.length === 0) {

                productGrid.innerHTML = `

                    <div class="empty-products">

                        No products available.

                    </div>

                `;

                return;

            }



            /* DISPLAY PRODUCTS */

            products.forEach(
                function(product) {


                    const stock =
                        Number(product.stock);


                    const outOfStock =
                        stock <= 0;



                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "product-card";



                    card.innerHTML = `

                        <div class="product-image">

                            ${product.emoji || "🥬"}

                        </div>


                        <h2>

                            ${product.name}

                        </h2>


                        <p>

                            Fresh
                            ${product.category.toLowerCase()}
                            from Dharshini Mart.

                        </p>


                        <h3>

                            ₹${product.price} / kg

                        </h3>


                        <div
                            class="stock-text
                            ${outOfStock
                                ? "out-stock"
                                : ""}"
                        >

                            ${
                                outOfStock
                                ? "Out of Stock"
                                : "Available Stock: " + stock
                            }

                        </div>


                        <button
                            ${
                                outOfStock
                                ? "disabled"
                                : ""
                            }

                            onclick="
                                addToCart(
                                    '${escapeProductName(product.name)}',
                                    ${product.price}
                                )
                            "
                        >

                            ${
                                outOfStock
                                ? "Out of Stock"
                                : "Add to Cart"
                            }

                        </button>

                    `;


                    productGrid.appendChild(
                        card
                    );

                }
            );

        }



        /* =====================================
           SAFE PRODUCT NAME
        ====================================== */

        function escapeProductName(name) {

            return name
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }



        /* =====================================
           ADD TO CART
        ====================================== */

        function addToCart(
            productName,
            price
        ) {


            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                ) || [];



            let existingProduct =
                cart.find(
                    item =>
                    item.name === productName
                );



            if (existingProduct) {

                existingProduct.quantity++;

            }

            else {

                cart.push({

                    name:
                        productName,

                    price:
                        Number(price),

                    quantity:
                        1

                });

            }



            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );



            alert(
                productName +
                " added to cart!"
            );

        }



        /* =====================================
           LOAD
        ====================================== */

        displayProducts();


    </script>


</body>

</html>
