<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dharshini Mart | Admin Orders</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f5;
            color: #26382c;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background: #20372a;
            color: white;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #d9b75d;
        }


        /* =========================
           MAIN
        ========================== */

        .container {
            width: 88%;
            max-width: 1200px;

            margin: 45px auto;
        }


        .heading p {
            color: #b18a35;

            font-size: 12px;

            letter-spacing: 3px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .heading h1 {
            font-size: 40px;

            color: #20372a;

            margin-bottom: 8px;
        }

        .heading span {
            color: #737b74;

            font-size: 15px;
        }


        /* =========================
           STATS
        ========================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin: 30px 0;
        }


        .stat {
            background: white;

            border: 1px solid #e0e5df;

            border-radius: 14px;

            padding: 22px;
        }


        .stat-title {
            color: #747c75;

            font-size: 13px;

            margin-bottom: 10px;
        }


        .stat-value {
            font-size: 28px;

            font-weight: bold;

            color: #20372a;
        }


        /* =========================
           ORDERS
        ========================== */

        .orders {
            display: flex;

            flex-direction: column;

            gap: 22px;
        }


        .order-card {
            background: white;

            border: 1px solid #e0e5df;

            border-radius: 16px;

            padding: 25px;
        }


        .order-top {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 20px;

            margin-bottom: 22px;
        }


        .order-id {
            font-size: 20px;

            font-weight: bold;

            color: #20372a;
        }


        .order-date {
            color: #777;

            font-size: 13px;

            margin-top: 7px;
        }


        /* =========================
           STATUS BADGE
        ========================== */

        .status {
            padding: 8px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            background: #e8f3e9;

            color: #28713c;
        }


        .status.cancelled {
            background: #ffe6e6;

            color: #b52b2b;
        }


        .status.delivered {
            background: #e1f4e5;

            color: #216442;
        }


        .status.preparing {
            background: #fff3d6;

            color: #956b12;
        }


        .status.out {
            background: #e5eefb;

            color: #315f91;
        }


        /* =========================
           CUSTOMER DETAILS
        ========================== */

        .details {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .detail-box {
            border-top:
                1px solid #edf0ed;

            padding-top: 15px;
        }


        .detail-box h4 {
            font-size: 13px;

            color: #697269;

            margin-bottom: 8px;
        }


        .detail-box p {
            line-height: 1.6;

            font-size: 14px;
        }


        /* =========================
           PRODUCTS
        ========================== */

        .ordered-products {
            margin-top: 22px;

            border-top:
                1px solid #edf0ed;

            padding-top: 18px;
        }


        .ordered-products h4 {
            margin-bottom: 12px;

            color: #697269;
        }


        .product-row {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding: 10px 0;

            border-bottom:
                1px solid #f0f2f0;
        }


        .product-row:last-child {
            border-bottom: none;
        }


        .product-name {
            font-size: 14px;

            color: #36483d;
        }


        .product-price {
            font-weight: bold;

            color: #26382c;
        }


        /* =========================
           PAYMENT
        ========================== */

        .payment-total {
            margin-top: 18px;

            padding-top: 18px;

            border-top:
                1px solid #e1e5e1;
        }


        .payment {
            color: #666;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .total {
            font-size: 21px;

            font-weight: bold;

            color: #216442;
        }


        /* =========================
           STATUS CONTROL
        ========================== */

        .status-control {
            margin-top: 22px;

            padding-top: 20px;

            border-top:
                1px solid #e5e8e5;
        }


        .status-control label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .status-control select {
            width: 100%;

            max-width: 420px;

            padding: 12px;

            border:
                1px solid #ccd5cc;

            border-radius: 8px;

            background: white;

            font-size: 14px;
        }


        .save-btn {
            margin-top: 10px;

            padding: 11px 20px;

            border: none;

            border-radius: 8px;

            background: #216442;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn:hover {
            background: #174d31;
        }


        /* =========================
           EMPTY
        ========================== */

        .empty {
            background: white;

            border:
                1px solid #e0e5df;

            border-radius: 15px;

            padding: 60px;

            text-align: center;

            color: #777;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 60px;

            background: #182e22;

            color: #dce5dd;

            text-align: center;

            padding: 25px;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .details {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            header {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
            }

            .container {
                width: 92%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">

            🥬 Dharshini Mart — Admin

        </div>


        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="admin-orders.html">
                Orders
            </a>

            <a href="admin-products.html">
                Products
            </a>

            <a href="home.html">
                Store
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <div class="heading">

            <p>
                ADMIN PANEL
            </p>

            <h1>
                Order Management
            </h1>

            <span>
                View customer orders and update delivery status.
            </span>

        </div>



        <!-- =========================
             STATISTICS
        ========================== -->

        <section class="stats">


            <div class="stat">

                <div class="stat-title">
                    Total Orders
                </div>

                <div
                    class="stat-value"
                    id="totalOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Active Orders
                </div>

                <div
                    class="stat-value"
                    id="activeOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Delivered
                </div>

                <div
                    class="stat-value"
                    id="deliveredOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Cancelled
                </div>

                <div
                    class="stat-value"
                    id="cancelledOrders"
                >
                    0
                </div>

            </div>


        </section>



        <!-- =========================
             ORDER LIST
        ========================== -->

        <section
            class="orders"
            id="ordersContainer"
        ></section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        © 2026 Dharshini Mart — Admin Panel

    </footer>



    <script>


        /* ==================================
           LOAD ORDERS
        ================================== */

        let orders =
            JSON.parse(
                localStorage.getItem(
                    "orders"
                )
            ) || [];



        /* ==================================
           DISPLAY ORDERS
        ================================== */

        function displayOrders() {


            const container =
                document.getElementById(
                    "ordersContainer"
                );


            container.innerHTML = "";


            updateStats();



            /* NO ORDERS */

            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <h2>
                            No Orders Yet
                        </h2>

                        <p>
                            Customer orders will appear here.
                        </p>

                    </div>

                `;

                return;

            }



            /* EACH ORDER */

            orders.forEach(
                function(order, index) {


                    /*
                       YOUR CHECKOUT FILE SAVES:
                       customerName
                       phone
                       email
                       address
                       city
                       pincode
                       payment
                       items
                       total
                       status
                    */


                    const customer =
                        order.customerName ||
                        "Customer";


                    const phone =
                        order.phone ||
                        "-";


                    const email =
                        order.email ||
                        "-";


                    const address =
                        order.address ||
                        "-";


                    const city =
                        order.city ||
                        "";


                    const pincode =
                        order.pincode ||
                        "";


                    const payment =
                        order.payment ||
                        "Cash on Delivery";


                    const status =
                        order.status ||
                        "Order Placed";


                    const orderId =
                        order.orderId ||
                        "ORDER";


                    const date =
                        order.date ||
                        "-";


                    const total =
                        Number(
                            order.total
                        ) || 0;


                    /*
                       IMPORTANT:
                       Checkout saves products
                       inside "items"
                    */

                    const items =
                        Array.isArray(
                            order.items
                        )
                        ? order.items
                        : [];



                    let productsHTML = "";



                    if (
                        items.length === 0
                    ) {

                        productsHTML = `

                            <div
                                style="
                                    color:#888;
                                    padding:10px 0;
                                "
                            >

                                No product details available.

                            </div>

                        `;

                    }

                    else {

                        items.forEach(
                            function(item) {


                                const name =
                                    item.name ||
                                    "Product";


                                const quantity =
                                    Number(
                                        item.quantity
                                    ) || 1;


                                const price =
                                    Number(
                                        item.price
                                    ) || 0;


                                const itemTotal =
                                    price *
                                    quantity;



                                productsHTML += `

                                    <div
                                        class="product-row"
                                    >

                                        <span
                                            class="product-name"
                                        >

                                            ${name}
                                            × ${quantity}

                                        </span>


                                        <strong
                                            class="product-price"
                                        >

                                            ₹${itemTotal}

                                        </strong>

                                    </div>

                                `;

                            }
                        );

                    }



                    /*
                       STATUS CLASS
                    */

                    let statusClass = "";


                    if (
                        status ===
                        "Cancelled"
                    ) {

                        statusClass =
                            "cancelled";

                    }

                    else if (
                        status ===
                        "Delivered"
                    ) {

                        statusClass =
                            "delivered";

                    }

                    else if (
                        status ===
                        "Preparing"
                    ) {

                        statusClass =
                            "preparing";

                    }

                    else if (
                        status ===
                        "Out for Delivery"
                    ) {

                        statusClass =
                            "out";

                    }



                    /*
                       FULL ADDRESS
                    */

                    let fullAddress =
                        address;


                    if (city) {

                        fullAddress +=
                            "<br>" + city;

                    }


                    if (pincode) {

                        fullAddress +=
                            " - " + pincode;

                    }



                    /* CREATE ORDER CARD */

                    container.innerHTML += `

                        <div
                            class="order-card"
                        >


                            <!-- TOP -->

                            <div
                                class="order-top"
                            >

                                <div>

                                    <div
                                        class="order-id"
                                    >

                                        #${orderId}

                                    </div>


                                    <div
                                        class="order-date"
                                    >

                                        ${date}

                                    </div>

                                </div>


                                <div
                                    class="
                                        status
                                        ${statusClass}
                                    "
                                >

                                    ${status}

                                </div>

                            </div>



                            <!-- CUSTOMER DETAILS -->

                            <div
                                class="details"
                            >


                                <div
                                    class="detail-box"
                                >

                                    <h4>
                                        Customer
                                    </h4>

                                    <p>
                                        ${customer}
                                    </p>

                                </div>



                                <div
                                    class="detail-box"
                                >

                                    <h4>
                                        Phone
                                    </h4>

                                    <p>
                                        ${phone}
                                    </p>

                                </div>



                                <div
                                    class="detail-box"
                                >

                                    <h4>
                                        Email
                                    </h4>

                                    <p>
                                        ${email}
                                    </p>

                                </div>



                                <div
                                    class="detail-box"
                                >

                                    <h4>
                                        Delivery Address
                                    </h4>

                                    <p>
                                        ${fullAddress}
                                    </p>

                                </div>


                            </div>



                            <!-- PRODUCTS -->

                            <div
                                class="ordered-products"
                            >

                                <h4>
                                    Ordered Products
                                </h4>


                                ${productsHTML}



                                <!-- PAYMENT + TOTAL -->

                                <div
                                    class="payment-total"
                                >

                                    <div
                                        class="payment"
                                    >

                                        Payment:
                                        <strong>
                                            ${payment}
                                        </strong>

                                    </div>


                                    <div
                                        class="total"
                                    >

                                        Total:
                                        ₹${total}

                                    </div>

                                </div>

                            </div>



                            <!-- STATUS -->

                            <div
                                class="status-control"
                            >

                                <label
                                    for="status-${index}"
                                >

                                    Update Order Status

                                </label>


                                <select
                                    id="status-${index}"
                                >

                                    <option
                                        value="Order Placed"
                                        ${
                                            status ===
                                            "Order Placed"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Order Placed

                                    </option>


                                    <option
                                        value="Preparing"
                                        ${
                                            status ===
                                            "Preparing"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Preparing

                                    </option>


                                    <option
                                        value="Out for Delivery"
                                        ${
                                            status ===
                                            "Out for Delivery"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Out for Delivery

                                    </option>


                                    <option
                                        value="Delivered"
                                        ${
                                            status ===
                                            "Delivered"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Delivered

                                    </option>


                                    <option
                                        value="Cancelled"
                                        ${
                                            status ===
                                            "Cancelled"
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        Cancelled

                                    </option>

                                </select>


                                <br>


                                <button
                                    class="save-btn"
                                    onclick="
                                        updateStatus(
                                            ${index}
                                        )
                                    "
                                >

                                    Update Status

                                </button>

                            </div>


                        </div>

                    `;

                }
            );

        }



        /* ==================================
           UPDATE ORDER STATUS
        ================================== */

        function updateStatus(index) {


            const select =
                document.getElementById(
                    "status-" + index
                );


            if (!select) {
                return;
            }


            const newStatus =
                select.value;


            orders[index].status =
                newStatus;



            /* SAVE */

            localStorage.setItem(
                "orders",
                JSON.stringify(
                    orders
                )
            );



            alert(
                "Order status updated to " +
                newStatus
            );



            displayOrders();

        }



        /* ==================================
           UPDATE STATISTICS
        ================================== */

        function updateStats() {


            const total =
                orders.length;



            const cancelled =
                orders.filter(
                    function(order) {

                        return (
                            (order.status ||
                            "Order Placed")
                            ===
                            "Cancelled"
                        );

                    }
                ).length;



            const delivered =
                orders.filter(
                    function(order) {

                        return (
                            (order.status ||
                            "Order Placed")
                            ===
                            "Delivered"
                        );

                    }
                ).length;



            const active =
                total -
                cancelled -
                delivered;



            document.getElementById(
                "totalOrders"
            ).textContent =
                total;


            document.getElementById(
                "activeOrders"
            ).textContent =
                active;


            document.getElementById(
                "deliveredOrders"
            ).textContent =
                delivered;


            document.getElementById(
                "cancelledOrders"
            ).textContent =
                cancelled;

        }



        /* ==================================
           START
        ================================== */

        displayOrders();


    </script>


</body>

</html>
